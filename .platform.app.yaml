name: jspspemu

type: nodejs:20

disk: 2048

build:
  flavor: none

dependencies:
  nodejs:
    yarn: "*"

hooks:
  build: |
    set -e
    yarn install
    yarn build

web:
  commands:
    start: "yarn serve"
  locations:
    "/":
      root: dist
      passthru: true
      index:
        - index.html
      allow: true
